services:
  litas:
    build: .
    container_name: listas
    ports:
      - "8000:80"
    depends_on:
      - mariadb
    networks:
      - litas-network
    volumes:
      - ./:/var/www/html
    environment:
      HOME: /tmp
    user: "${UID:-1000}:${GID:-1000}"

  mariadb:
    image: mariadb:11
    container_name: listas_mariadb
    restart: always
    environment:
      MYSQL_DATABASE: listas
      MYSQL_USER: listas
      MYSQL_PASSWORD: listas
      MYSQL_ROOT_PASSWORD: listas
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - litas-network

  selenium:
    image: selenium/standalone-chrome
    container_name: listas_selenium
    ports:
      - "7900:7900" # VNC (pra ver o browser rodando)
    networks:
      - litas-network
    shm_size: 2gb
  
  senhaunica-faker:
    image: uspdev/senhaunica-faker
    container_name: listas_senhaunica-faker
    ports:
      - "3141:3141"
    environment:
          - APP_URL=http://auth.local:3141
    networks:
      litas-network:
        aliases:
          - auth.local

networks:
  litas-network:

volumes:
  mariadb_data: